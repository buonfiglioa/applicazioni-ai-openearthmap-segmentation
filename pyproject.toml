[project]
name = "applicazioni-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pytorch-lightning>=2.6.6",
    "rasterio>=1.5.2",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
